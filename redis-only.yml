services:
  redis:
    image: redis:7-alpine
    container_name: test-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-test-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  redis-test-data: